name: 签名打包

on:
  push:
    tags:
      - 'v*'

jobs:
  clear:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 清理无效执行
        run: |
          echo ">>> 获取仓库所有 workflow runs"
          ALL_RUNS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100" \
            | jq -r '.workflow_runs[] | "\(.id)|\(.head_branch)|\(.status)|\(.conclusion)|\(.display_title)"')
          if [ -z "$ALL_RUNS" ]; then
            echo ">>> 没有找到任何 workflow runs"
            exit 0
          fi
          echo ">>> 当前 tag: ${{ github.ref_name }}"
          echo ">>> 当前 run: #${{ github.run_number }} (ID: ${{ github.run_id }})"
          DELETE_IDS=""
          while IFS= read -r line; do
            ID=$(echo "$line" | cut -d'|' -f1)
            BRANCH=$(echo "$line" | cut -d'|' -f2)
            STATUS=$(echo "$line" | cut -d'|' -f3)
            CONCLUSION=$(echo "$line" | cut -d'|' -f4)
            TITLE=$(echo "$line" | cut -d'|' -f5)
            if [ "$ID" = "${{ github.run_id }}" ]; then
              echo ">>> 跳过当前 run: #${{ github.run_number }} $ID"
              continue
            fi
            if [ "$CONCLUSION" = "failure" ] || [ "$CONCLUSION" = "cancelled" ] || [ "$STATUS" = "cancelled" ] || [ "$BRANCH" = "${{ github.ref_name }}" ]; then
              echo ">>> 标记删除: $ID ($BRANCH, $STATUS, $CONCLUSION)"
              DELETE_IDS="$DELETE_IDS $ID"
            fi
          done <<< "$ALL_RUNS"
          if [ -z "$DELETE_IDS" ]; then
            echo ">>> 没有需要清理的 runs"
          else
            echo ">>> 正在删除..."
            for ID in $DELETE_IDS; do
              echo ">>> 删除 run $ID"
              STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs/$ID")
              if [ "$STATUS_CODE" = "204" ]; then
                echo "    ✅ 删除成功"
              else
                echo "    ❌ 删除失败 (HTTP $STATUS_CODE)"
              fi
            done
            echo ">>> 清理完成"
          fi

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取项目代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 克隆私有插件
        run: |
          echo ">>> 清理旧插件目录"
          rm -rf "$GITHUB_WORKSPACE/../cordova-plugin-tyan"
          echo ">>> 克隆 cordova-plugin-tyan"
          git clone https://oauth2:${{ secrets.PAT_TOKEN }}@github.com/lyu2026/cordova-plugin-tyan.git \
            "$GITHUB_WORKSPACE/../cordova-plugin-tyan"
          echo ">>> 克隆完成"
          ls -la "$GITHUB_WORKSPACE/../cordova-plugin-tyan"

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 缓存命令工具
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/cmdline-tools/16.0
          key: android-cmdline-tools-16.0-${{ runner.os }}

      - name: 修复SDK版本
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          echo ">>> 清理错误的预装版本"
          rm -rf /usr/local/lib/android/sdk/cmdline-tools/latest
          
          echo ">>> 下载正确的命令行工具"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
          unzip -q commandlinetools-linux-*.zip -d /tmp/cmdline-tools
          mkdir -p /usr/local/lib/android/sdk/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools /usr/local/lib/android/sdk/cmdline-tools/16.0
          
          echo ">>> 创建 latest 软链接"
          ln -sf /usr/local/lib/android/sdk/cmdline-tools/16.0 /usr/local/lib/android/sdk/cmdline-tools/latest

      - name: 设置环境变量
        run: |
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/16.0/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: 接受SDK许可
        run: yes | sdkmanager --licenses > /dev/null 2>&1

      - name: 安装打包组件
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" > /dev/null 2>&1

      - name: 配置 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 修复NPM缓存
        run: |
          rm -rf ~/.npm /home/runner/.npm
          CLEAN_CACHE_DIR=$(mktemp -d -t npm-cache-XXXXXX)
          mkdir -p "$CLEAN_CACHE_DIR"
          npm config set cache "$CLEAN_CACHE_DIR"
          npm config set prefer-offline false
          npm config set prefer-online true

      - name: 安装科尔多瓦
        run: |
          npm config set fund false
          npm install -g --loglevel=error cordova@^13.0.0

      - name: 安装项目依赖
        run: |
          npm config set fund false
          npm install --no-audit --no-fund --loglevel=error > /dev/null

      - name: 添加安卓平台
        run: |
          npm config set fund false
          rm -rf platforms/android/app/build platforms/android/build platforms/android/.gradle output
          cordova platform add android@13.0.0 > /dev/null

      - name: 解密签名信息
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$GITHUB_WORKSPACE/tyan.keystore"

      - name: 区分架构打包
        run: |
          KEYSTORE_PATH="$GITHUB_WORKSPACE/tyan.keystore"
          ABIS=("arm64-v8a" "armeabi-v7a")
          mkdir -p output
          npm config set fund false
          
          ERROR_LOG=$(mktemp)
          HAS_ERROR=false
      
          for ABI in "${ABIS[@]}"; do
            echo ">>> 正在打包架构：$ABI"
            
            if [ "$HAS_ERROR" = true ]; then
              echo ">>> 跳过 $ABI（已有错误）"
              continue
            fi
      
            rm -f platforms/android/app/src/main/res/xml/config.xml
            rm -f platforms/android/res/xml/config.xml
      
            CURRENT_LOG=$(mktemp)
            GRADLE_OPTS="-Dorg.gradle.warning.mode=none" cordova build android --release -- \
              --packageType=apk \
              --gradleArg="-PtargetAbi=$ABI" \
              --keystore="$KEYSTORE_PATH" \
              --storePassword="Tyan2026" \
              --alias="tyan" \
              --password="Tyan2026" 2>&1 > /dev/null \
              | sed 's/^[ \t]*//;s/[ \t]*$//' \
              | grep -v "^Note: " \
              | sed '/^FAILURE: Build failed with an exception./,$d' \
              | grep -v "^$" \
              | sed "s|$PWD/||g" \
              | sed "s|/home/runner/work/tyan/tyan/||g" \
              | sed "s|platforms/android/app/src/main/java/com/plugin/tyan||g" > "$CURRENT_LOG" || true
            
            if grep -E "FAILURE|BUILD FAILED|error:" "$CURRENT_LOG" | grep -q .; then
              HAS_ERROR=true
              cat "$CURRENT_LOG" >> "$ERROR_LOG"
              echo ">>> $ABI 打包失败"
            elif [ -f platforms/android/app/build/outputs/apk/release/app-release.apk ]; then
              cp platforms/android/app/build/outputs/apk/release/app-release.apk \
                 output/${ABI}.apk
              echo ">>> $ABI 打包完成"
            else
              HAS_ERROR=true
              echo "[$ABI] APK文件未生成" > "$ERROR_LOG"
              echo ">>> $ABI APK文件未生成"
            fi
            
            rm -f "$CURRENT_LOG"
          done
          
          if [ "$HAS_ERROR" = true ]; then
            echo "### ❌ Android 区分架构打包未通过" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat "$ERROR_LOG" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: 获取版本编号
        id: version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=$(echo "$TAG_NAME" | sed 's/^v//' | sed 's/^release-//')
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 获取构建时间
        id: time
        run: |
          export TZ='Asia/Shanghai'
          echo "datetime=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: 生成发布信息
        id: apk_info
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd output
          {
            echo "### 📦 文件清单"
            echo ""
            echo "| 文件名 | 大小 | SHA256 |"
            echo "|--------|------|--------|"
            for apk in *.apk; do
              SIZE=$(ls -lh "$apk" | awk '{print $5}')
              SHA256=$(sha256sum "$apk" | cut -d ' ' -f 1)
              echo "| $apk | $SIZE | \`$SHA256\` |"
            done
          } > ../manifest.md
          cd ..
          CURRENT_TAG="${{ steps.version.outputs.tag_name }}"
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${CURRENT_TAG}$" | head -1)
          CHANGELOG=""
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG_CONTENT=$(git log "${PREV_TAG}..${CURRENT_TAG}" \
              --pretty=format:"- %s (%h, @%an)" \
              --no-merges | grep -v "^- \. (" || true)
            if [ -n "$CHANGELOG_CONTENT" ]; then
              {
                echo "### 📝 更新内容"
                echo ""
                echo "$CHANGELOG_CONTENT"
                echo ""
              } > release_changelog.md
              CHANGELOG=$(cat release_changelog.md)
            fi
          fi
          if [ -z "$CHANGELOG" ]; then
            echo ">>> 没有更新内容，跳过 changelog"
          fi
          MANIFEST=$(cat manifest.md)
          DATETIME="${{ steps.time.outputs.datetime }}"
          {
            echo "## 🫧 廷琰 V${VERSION}"
            echo ""
            echo "### 📦 版本信息"
            echo "| 项目 | 信息 |"
            echo "|------|------|"
            echo "| 版本号 | V${VERSION} |"
            echo "| 构建时间 | ${DATETIME} |"
            echo ""
            if [ -n "$CHANGELOG" ]; then
              echo "${CHANGELOG}"
            fi
            echo "${MANIFEST}"
            echo ""
            echo "### 🧩 插件能力"
            echo ""
            echo "基于 \`cordova-plugin-tyan\` 插件，提供以下能力："
            echo ""
            echo "| 模块 | 功能 | 说明 |"
            echo "|------|------|------|"
            echo "| 📋 剪贴板 | 读写清空 | 复制粘贴 |"
            echo "| 🔦 手电筒 | 开关控制 | 手灯操作 |"
            echo "| 📱 屏幕方向 | 锁定/解锁 | 横屏竖屏 |"
            echo "| 🔐 生物认证 | 指纹/面容 | 设备认证 |"
            echo "| 🌐 网络状态 | WiFi/移动 | 网络诊断 |"
            echo "| 🔗 代理管理 | 代理/池 | 网络代理 |"
            echo "| 📩 接码平台 | 取号/取码 | 短信接码 |"
            echo "| 💬 短信发送 | 发送/多卡 | 系统短信 |"
            echo "| ☁️ 云盘存储 | 传载列删 | Koofr云盘 |"
            echo "| 🌤️ 天气查询 | 实时天气 | 温湿风气 |"
            echo "| 🗄️ 数据库 | 存储/同步 | 本地+云密 |"
            echo "| 📍 定位服务 | 定位/编码 | GPS |"
            echo "| 🎤 语音识别 | 离线引擎 | 录音识别 |"
            echo "| 🔔 通知管理 | 发送/角标 | 系统通知 |"
            echo "| 🖼️ 图片预览 | 全屏/分享 | 图片浏览 |"
            echo "| 📂 文件选择 | 单选/多选 | 文件选择 |"
            echo ""
            echo "### 📺 功能模块"
            echo ""
            echo "| 模块 | 用途 |"
            echo "|------|------|"
            echo "| 📡 系统配置 | 应用参数设置 |"
            echo "| 🎬 努努影院 | 视频点播 |"
            echo "| 🎬 欧乐视频 | 视频点播 |"
            echo "| 🎬 爱壹帆 | 视频点播 |"
            echo "| 📰 实时资讯 | 新闻阅读 |"
            echo "| 📚 科学文库 | 图书阅读 |"
            echo "| 🖼 图片仓库 | 图片浏览 |"
            echo "| 📔 私人日记 | 日记记录 |"
            echo ""
            echo "### 📥 安装说明"
            echo "1. 大多数现代手机选择 \`arm64-v8a\`"
            echo "2. 老旧手机选择 \`armeabi-v7a\`"
            echo "3. 下载后在手机上允许安装未知来源应用"
            echo "4. 点击 APK 进行安装"
            echo ""
            echo "### 🔧 技术支持"
            echo "| 项目 | 值 |"
            echo "|------|-----|"
            echo "| 语音识别 | Whisper + TensorFlow 离线引擎 |"
            echo "| 数据库 | SQLite + 云加密同步 |"
            echo "| 云存储 | Koofr 云盘 |"
            echo "| 天气数据 | Open-Meteo 免费 API |"
            echo "| 代理服务 | Webshare.io 代理池 |"
          } > release_body_full.md

      - name: 发布并上传包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: 廷琰 v${{ steps.version.outputs.version }}
          body_path: release_body_full.md
          files: output/*.apk
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建完成通知
        if: success()
        run: |
          echo "✅ 所有 APK 包构建成功"
          ls -lh output/

      - name: 构建失败通知
        if: failure()
        run: |
          echo "❌ 构建失败，请检查日志"
          exit 1